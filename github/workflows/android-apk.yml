name: Build TN Tycoon Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Extract TN Tycoon project
        run: |
          set -eux

          ZIP="$(find . -maxdepth 2 -type f -name 'TN_Tycoon*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "TN Tycoon ZIP was not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

          echo "Searching for Android project..."

          ANDROID_DIR="$(find project -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$ANDROID_DIR" ]; then
            echo "Android Gradle project was not found."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Android project found at: $ANDROID_DIR"

          echo "$ANDROID_DIR" > android_dir.txt

      - name: Prepare SDL2
        run: |
          set -eux
          ANDROID_DIR="$(cat android_dir.txt)"

          chmod +x "$ANDROID_DIR/gradlew"

          if [ -f "$ANDROID_DIR/scripts/fetch_android_deps.sh" ]; then
            bash "$ANDROID_DIR/scripts/fetch_android_deps.sh"
          fi

      - name: Build APK
        run: |
          set -eux
          ANDROID_DIR="$(cat android_dir.txt)"

          cd "$ANDROID_DIR"

          chmod +x ./gradlew

          ./gradlew :app:assembleDebug --no-daemon

      - name: Find APK
        run: |
          set -eux

          APK="$(find project -type f -name 'app-debug.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "APK was not produced."
            find project -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" TN_Tycoon_app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TN_Tycoon_Android_APK
          path: TN_Tycoon_app-debug.apk
          if-no-files-found: error
