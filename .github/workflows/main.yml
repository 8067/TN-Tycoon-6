name: Build TN Tycoon Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Project extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find project \
            -type f \
            -name "gradlew" \
            -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: gradlew not found"
            find project -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          echo "Android project:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Show installed NDK
        shell: bash
        run: |
          echo "Installed NDK:"
          ls -la "$ANDROID_SDK_ROOT/ndk"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Download SDL2
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          bash scripts/fetch_android_deps.sh

      - name: Check Android configuration
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          echo "===== build.gradle ====="
          cat app/build.gradle

          echo "===== CMakeLists.txt ====="
          cat app/src/main/cpp/CMakeLists.txt

      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "app-debug.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" TN_Tycoon_app-debug.apk

          ls -lh TN_Tycoon_app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TN-Tycoon-Android-APK
          path: TN_Tycoon_app-debug.apk
          if-no-files-found: error
